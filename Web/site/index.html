<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sportas šiandien</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Šiandien">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#000; --bg2:#1c1c1e;
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.24); --tint:#0a84ff;
  --nav:rgba(0,0,0,.7);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:var(--ui);color:var(--label);
  -webkit-font-smoothing:antialiased;
  font-size:17px;line-height:1.3;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ── navigation stack ── */
#stack{position:fixed;inset:0}
.view{
  position:absolute;inset:0;background:var(--bg);
  display:flex;flex-direction:column;will-change:transform;
}
.view.push{animation:pushIn .34s cubic-bezier(.32,.72,0,1) both}
.view.pop{animation:pushOut .3s cubic-bezier(.32,.72,0,1) both}
.view.under{animation:under .34s cubic-bezier(.32,.72,0,1) both;transform:translateX(-24%);filter:brightness(.62)}
.view.back{animation:back .3s cubic-bezier(.32,.72,0,1) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pushOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes under{from{transform:translateX(0);filter:brightness(1)}to{transform:translateX(-24%);filter:brightness(.62)}}
@keyframes back{from{transform:translateX(-24%);filter:brightness(.62)}to{transform:translateX(0);filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.view.push,.view.pop,.view.under,.view.back{animation-duration:.01s}}

/* ── nav bar ── */
.nav{
  position:absolute;top:0;left:0;right:0;z-index:4;
  padding-top:env(safe-area-inset-top);
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s;
}
.nav.edge{border-bottom-color:var(--sep)}
.nav .navinner{width:100%}
.nav .bar{height:44px;display:flex;align-items:center;position:relative;padding:0 8px;box-sizing:border-box}
.nav .title{
  position:absolute;left:74px;right:74px;text-align:center;
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity .18s;
}
.nav .title.on{opacity:1}
.nav .back{display:flex;align-items:center;gap:4px;color:var(--tint);padding:8px 10px;font-size:17px}
.nav .back svg{width:11px;height:19px;flex:none}
.nav .trail{margin-left:auto;position:relative;display:flex;align-items:center}
.nav .trail svg{width:24px;height:24px;color:var(--tint);display:block}
.nav .trail select{position:absolute;inset:-10px;opacity:0;font-size:16px}

/* ── scroller ── */
.scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:calc(44px + env(safe-area-inset-top));
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
.scroll::-webkit-scrollbar{display:none}

/* One column, centred. The app is a phone layout; on a wide screen it
   should sit in the middle rather than stretch a fixture across a metre. */
.inner{max-width:600px;margin:0 auto;width:100%}
.nav .bar{max-width:600px;margin:0 auto;width:100%}

/* ── wide screens read as a site, not a phone ──
   The filter stops hiding behind an icon and becomes a row of links, with
   the name on the left the way a header works. The timeline keeps its
   column; only the chrome widens. */
.brand{display:none}

/* The filter is the main personalisation in the app. Behind an icon it was
   invisible — there was nothing to say the timeline could become a
   different one. It is navigation, so it looks like navigation. */
.links{
  display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none;
  padding:2px var(--pad) 10px;
}
.links::-webkit-scrollbar{display:none}
.links button{
  flex:none;padding:7px 14px;border-radius:999px;font-size:15px;
  background:var(--fill);color:var(--label2);white-space:nowrap;
}
.links button.on{background:var(--label);color:#000;font-weight:500}
.links button:active{opacity:.7}
.scroll{padding-top:calc(44px + env(safe-area-inset-top))}
.nav.tall ~ .scroll{padding-top:calc(88px + env(safe-area-inset-top))}
@media (min-width:900px){
  .nav .navinner{
    max-width:1040px;margin:0 auto;display:flex;align-items:center;padding:0 24px;
  }
  .nav .bar{height:56px;padding:0;flex:none;width:auto;max-width:none}
  .nav .title{display:none}
  .brand{
    display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;
    color:var(--label);white-space:nowrap;
  }
  .links{
    gap:4px;margin-left:auto;padding:0;
    /* More sports should scroll rather than push the name off the edge. */
    min-width:0;
  }
  .links button{
    padding:7px 12px;border-radius:8px;background:none;
  }
  .links button:hover{color:var(--label);background:var(--fill)}
  .links button.on{background:var(--fill);color:var(--label)}
  .brand{flex:none}
  .links button{
    padding:7px 12px;border-radius:8px;font-size:15px;color:var(--label2);
    white-space:nowrap;
  }
  .links button:hover{color:var(--label);background:var(--fill)}
  .links button.on{color:var(--label);background:var(--fill);font-weight:500}
  .scroll,.nav.tall ~ .scroll{padding-top:56px}
  h1.day.first{margin-top:20px}
}

/* A second filter, and only when the first one asks for it: pick Lithuania
   and the sports inside it appear. Not a permanent band. */
.chips{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:10px var(--pad) 4px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 14px;border-radius:999px;font-size:15px;
  background:var(--fill);color:var(--label2);white-space:nowrap;
}
.chip.on{background:var(--label);color:#000;font-weight:500}
.chip:active{opacity:.7}

/* ── content ── */
h1.day{
  font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.12;
  margin:34px var(--pad) 10px;
}
h1.day.first{margin-top:8px}
.large{font-size:34px;font-weight:700;letter-spacing:-.022em;margin:8px var(--pad) 14px}

.row{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px var(--pad);width:100%;text-align:left;
}
.row:active{background:var(--fill)}
.row .body{display:flex;gap:16px;flex:1;min-width:0}
.row .t{
  width:52px;flex:none;font-size:15px;color:var(--label2);
  font-variant-numeric:tabular-nums;padding-top:1px;
}
.row .main{min-width:0;flex:1}
.row .ttl{font-size:17px;font-weight:600;letter-spacing:-.011em}
.row.p1 .ttl{font-weight:400}
.row.p0 .ttl{font-weight:400;font-size:15px;color:var(--label2)}
.row.p0 .t{color:var(--label3)}
.row .why{font-size:15px;margin-top:3px}
.row .meta{font-size:13px;color:var(--label3);margin-top:4px}
.row .n{font-size:13px;color:var(--label2);margin-top:5px;line-height:1.36}
.row .chev{color:var(--label3);font-size:13px;font-weight:600;align-self:center;flex:none}
.row .live{
  display:inline-flex;align-items:center;gap:5px;font-size:13px;
  font-weight:500;color:var(--label2);white-space:nowrap;margin-left:8px;
}
.row .live i{width:6px;height:6px;border-radius:50%;background:var(--tint)}
.ttlline{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sep{height:.5px;background:var(--sep);margin-left:var(--pad)}

.util{display:flex;align-items:center;gap:12px;padding:14px var(--pad);width:100%;font-size:17px;text-align:left}
.util:active{background:var(--fill)}
.util .chev{color:var(--label3);font-size:13px;font-weight:600}
.util .stack{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.util .stack .s{font-size:13px;color:var(--label3)}
.count{color:var(--label2);font-variant-numeric:tabular-nums;margin-left:auto;padding-right:10px}

.verdict{padding:22px var(--pad) 6px}
.verdict .a{font-size:22px;letter-spacing:-.012em}
.verdict .b{font-size:17px;color:var(--label2);margin-top:7px}

.note{
  margin:22px var(--pad);padding:14px 16px;background:var(--bg2);
  border-radius:12px;font-size:14px;color:var(--label2);line-height:1.45;
}

/* ── event detail ── */
.detail{padding:4px var(--pad) 24px;display:flex;flex-direction:column;min-height:100%}
.detail h2{font-size:34px;font-weight:700;letter-spacing:-.024em;line-height:1.13;margin:0}
.detail .when{font-size:17px;color:var(--label2);margin-top:10px}
.detail .why{font-size:17px;margin-top:22px;line-height:1.42}
.detail .live{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--label2);margin-top:12px}
.detail .live i{width:7px;height:7px;border-radius:50%;background:var(--tint)}
.acts{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.btn{
  display:block;width:100%;text-align:center;text-decoration:none;
  padding:15px 18px;border-radius:14px;font-size:17px;font-weight:600;
  background:var(--tint);color:#fff;
}
.btn.sec{background:var(--fill);color:var(--tint);font-weight:400}
.btn:active{opacity:.7}
.hint{font-size:13px;color:var(--label2);margin-top:12px}
.detail .notehint{font-size:15px;color:var(--label2);margin-top:14px;line-height:1.4}
.reveal{margin-top:auto;padding-top:20px;border-top:.5px solid var(--sep)}
.reveal a{color:var(--label2);font-size:15px;text-decoration:none;display:block;padding:14px 0}
</style>
</head>
<body>
<div id="stack"></div>
<script src="app.js"></script>
</body>
</html>
